<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">The Three Patterns That Matter Most In Foundational Backlinks</title><desc id="desc">The Three Patterns That Matter Most In Foundational Backlinks</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#11161f"/><stop offset="100%" stop-color="#223342"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#84cc16"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#84cc16"/><stop offset="100%" stop-color="#fb923c"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><style>.ey{font:700 18px Inter,Arial,sans-serif;letter-spacing:2.6px;text-transform:uppercase;fill:#84cc16}.hd{font:700 48px Outfit,Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:500 20px Inter,Arial,sans-serif;fill:#dbe7f6}.label{font:700 24px Outfit,Inter,Arial,sans-serif;fill:#f8fafc}.copy{font:500 17px Inter,Arial,sans-serif;fill:#c9d7ea}.muted{font:600 15px Inter,Arial,sans-serif;fill:#a8bbd6}.chip{font:700 18px Inter,Arial,sans-serif;fill:#0b1220}</style></defs><rect width="1200" height="760" fill="url(#bg)"/><circle cx="1085" cy="104" r="145" fill="#38bdf8" opacity="0.12"/><circle cx="155" cy="675" r="180" fill="#84cc16" opacity="0.10"/><circle cx="920" cy="640" r="110" fill="#fb923c" opacity="0.09"/><path d="M110 650C250 600 310 520 430 470" stroke="#84cc16" stroke-width="3" opacity="0.18" stroke-dasharray="10 12" fill="none"/><path d="M790 170C920 200 1010 265 1090 360" stroke="#38bdf8" stroke-width="3" opacity="0.16" stroke-dasharray="10 12" fill="none"/><text class="ey" x="80" y="78">Core Patterns</text><text class="hd" x="80" y="138"><tspan x="80" dy="0">The Three Patterns That Matter Most</tspan><tspan x="80" dy="22">In Foundational Backlinks</tspan></text><rect x="70" y="220" width="290" height="390" rx="28" fill="#16232f" stroke="rgba(255,255,255,0.12)"/><rect x="70" y="220" width="290" height="8" rx="4" fill="url(#ga)"/><circle cx="310" cy="285" r="42" fill="url(#ga)"/><text x="310" y="293" class="chip" text-anchor="middle">92</text><text class="label" x="98" y="288">Profiles</text><text class="copy" x="98" y="340"><tspan x="98" dy="0">Brand-oriented properties</tspan><tspan x="98" dy="22">help establish presence.</tspan></text><rect x="405" y="220" width="290" height="390" rx="28" fill="#16232f" stroke="rgba(255,255,255,0.12)"/><rect x="405" y="220" width="290" height="8" rx="4" fill="url(#gb)"/><circle cx="645" cy="285" r="42" fill="url(#gb)"/><text x="645" y="293" class="chip" text-anchor="middle">86</text><text class="label" x="433" y="288">Listings</text><text class="copy" x="433" y="340"><tspan x="433" dy="0">Directories reinforce</tspan><tspan x="433" dy="22">business details and</tspan><tspan x="433" dy="22">category fit.</tspan></text><rect x="740" y="220" width="290" height="390" rx="28" fill="#16232f" stroke="rgba(255,255,255,0.12)"/><rect x="740" y="220" width="290" height="8" rx="4" fill="url(#gc)"/><circle cx="980" cy="285" r="42" fill="url(#gc)"/><text x="980" y="293" class="chip" text-anchor="middle">90</text><text class="label" x="768" y="288">Foundations</text><text class="copy" x="768" y="340"><tspan x="768" dy="0">A broader safe mix</tspan><tspan x="768" dy="22">strengthens the base</tspan><tspan x="768" dy="22">layer.</tspan></text><rect x="70" y="650" width="1060" height="62" rx="20" fill="#264055" stroke="rgba(255,255,255,0.12)"/><text class="copy" x="600" y="689" text-anchor="middle">Stronger campaigns usually work because these patterns reinforce each other, not because one lever is pushed in isolation.</text></svg>
