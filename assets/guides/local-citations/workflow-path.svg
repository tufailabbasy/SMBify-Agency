<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">A Cleaner Citation Delivery Workflow</title><desc id="desc">A Cleaner Local Citations Workflow From Setup To Review</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101225"/><stop offset="100%" stop-color="#202b56"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#fb923c"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><style>.ey{font:700 18px Inter,Arial,sans-serif;letter-spacing:2.6px;text-transform:uppercase;fill:#fb923c}.hd{font:700 48px Outfit,Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:500 20px Inter,Arial,sans-serif;fill:#dbe7f6}.label{font:700 24px Outfit,Inter,Arial,sans-serif;fill:#f8fafc}.copy{font:500 17px Inter,Arial,sans-serif;fill:#c9d7ea}.muted{font:600 15px Inter,Arial,sans-serif;fill:#a8bbd6}.chip{font:700 18px Inter,Arial,sans-serif;fill:#0b1220}</style></defs><rect width="1200" height="760" fill="url(#bg)"/><circle cx="1085" cy="104" r="145" fill="#818cf8" opacity="0.12"/><circle cx="155" cy="675" r="180" fill="#fb923c" opacity="0.10"/><circle cx="920" cy="640" r="110" fill="#22d3ee" opacity="0.09"/><path d="M110 650C250 600 310 520 430 470" stroke="#fb923c" stroke-width="3" opacity="0.18" stroke-dasharray="10 12" fill="none"/><path d="M790 170C920 200 1010 265 1090 360" stroke="#818cf8" stroke-width="3" opacity="0.16" stroke-dasharray="10 12" fill="none"/><text class="ey" x="80" y="78">Workflow</text><text class="hd" x="80" y="138">A Cleaner Citation Delivery Workflow</text><rect x="70" y="210" width="1060" height="350" rx="34" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/><path d="M250 392H270" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/><polygon points="266,392 246,380 246,404" fill="#818cf8"/><path d="M470 392H490" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/><polygon points="486,392 466,380 466,404" fill="#fb923c"/><path d="M690 392H710" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/><polygon points="706,392 686,380 686,404" fill="#22d3ee"/><path d="M910 392H930" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/><polygon points="926,392 906,380 906,404" fill="#818cf8"/><rect x="70" y="290" width="180" height="205" rx="24" fill="#171d39" stroke="rgba(255,255,255,0.12)"/><circle cx="116" cy="338" r="28" fill="#818cf8"/><text x="116" y="346" class="chip" text-anchor="middle">1</text><text class="label" x="98" y="392">Confirm the source of truth</text><text class="copy" x="98" y="430"><tspan x="98" dy="0">Confirm the source</tspan><tspan x="98" dy="22">of truth keeps the</tspan><tspan x="98" dy="22">work easier to</tspan><tspan x="98" dy="22">explain and</tspan><tspan x="98" dy="22">review.</tspan></text><rect x="290" y="290" width="180" height="205" rx="24" fill="#171d39" stroke="rgba(255,255,255,0.12)"/><circle cx="336" cy="338" r="28" fill="#fb923c"/><text x="336" y="346" class="chip" text-anchor="middle">2</text><text class="label" x="318" y="392">Audit stale and duplicate listings</text><text class="copy" x="318" y="430"><tspan x="318" dy="0">Audit stale and</tspan><tspan x="318" dy="22">duplicate listings</tspan><tspan x="318" dy="22">keeps the work</tspan><tspan x="318" dy="22">easier to explain</tspan><tspan x="318" dy="22">and review.</tspan></text><rect x="510" y="290" width="180" height="205" rx="24" fill="#171d39" stroke="rgba(255,255,255,0.12)"/><circle cx="556" cy="338" r="28" fill="#22d3ee"/><text x="556" y="346" class="chip" text-anchor="middle">3</text><text class="label" x="538" y="392">Submit core directories first</text><text class="copy" x="538" y="430"><tspan x="538" dy="0">Submit core</tspan><tspan x="538" dy="22">directories first</tspan><tspan x="538" dy="22">keeps the work</tspan><tspan x="538" dy="22">easier to explain</tspan><tspan x="538" dy="22">and review.</tspan></text><rect x="730" y="290" width="180" height="205" rx="24" fill="#171d39" stroke="rgba(255,255,255,0.12)"/><circle cx="776" cy="338" r="28" fill="#818cf8"/><text x="776" y="346" class="chip" text-anchor="middle">4</text><text class="label" x="758" y="392">Verify live and claimed profiles</text><text class="copy" x="758" y="430"><tspan x="758" dy="0">Verify live and</tspan><tspan x="758" dy="22">claimed profiles</tspan><tspan x="758" dy="22">keeps the work</tspan><tspan x="758" dy="22">easier to explain</tspan><tspan x="758" dy="22">and review.</tspan></text><rect x="950" y="290" width="180" height="205" rx="24" fill="#171d39" stroke="rgba(255,255,255,0.12)"/><circle cx="996" cy="338" r="28" fill="#fb923c"/><text x="996" y="346" class="chip" text-anchor="middle">5</text><text class="label" x="978" y="392">Maintain after changes</text><text class="copy" x="978" y="430"><tspan x="978" dy="0">Maintain after</tspan><tspan x="978" dy="22">changes keeps the</tspan><tspan x="978" dy="22">work easier to</tspan><tspan x="978" dy="22">explain and</tspan><tspan x="978" dy="22">review.</tspan></text><rect x="170" y="620" width="860" height="60" rx="20" fill="#26305f" stroke="rgba(255,255,255,0.12)"/><text class="copy" x="600" y="658" text-anchor="middle">Better workflows make the service easier to trust because readers can see where the work starts, what happens next, and how it is reviewed.</text></svg>
