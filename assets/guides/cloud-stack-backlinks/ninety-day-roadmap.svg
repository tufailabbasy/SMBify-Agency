<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">A 90-Day Cloud Stack Roadmap</title><desc id="desc">A 90-Day Cloud Stack Backlinks Roadmap</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1124"/><stop offset="100%" stop-color="#1d2550"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#34d399"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient><style>.ey{font:700 18px Inter,Arial,sans-serif;letter-spacing:2.6px;text-transform:uppercase;fill:#a78bfa}.hd{font:700 48px Outfit,Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:500 20px Inter,Arial,sans-serif;fill:#dbe7f6}.label{font:700 24px Outfit,Inter,Arial,sans-serif;fill:#f8fafc}.copy{font:500 17px Inter,Arial,sans-serif;fill:#c9d7ea}.muted{font:600 15px Inter,Arial,sans-serif;fill:#a8bbd6}.chip{font:700 18px Inter,Arial,sans-serif;fill:#0b1220}</style></defs><rect width="1200" height="760" fill="url(#bg)"/><circle cx="1085" cy="104" r="145" fill="#60a5fa" opacity="0.12"/><circle cx="155" cy="675" r="180" fill="#a78bfa" opacity="0.10"/><circle cx="920" cy="640" r="110" fill="#34d399" opacity="0.09"/><path d="M110 650C250 600 310 520 430 470" stroke="#a78bfa" stroke-width="3" opacity="0.18" stroke-dasharray="10 12" fill="none"/><path d="M790 170C920 200 1010 265 1090 360" stroke="#60a5fa" stroke-width="3" opacity="0.16" stroke-dasharray="10 12" fill="none"/><text class="ey" x="80" y="78">Compounding Plan</text><text class="hd" x="80" y="138">A 90-Day Cloud Stack Roadmap</text><rect x="80" y="230" width="310" height="345" rx="30" fill="#151b36" stroke="rgba(255,255,255,0.12)"/><rect x="80" y="230" width="310" height="8" rx="4" fill="url(#ga)"/><text class="label" x="110" y="296">Plan structure</text><text class="copy" x="110" y="340"><tspan x="110" dy="0">Choose the page, signals,</tspan><tspan x="110" dy="22">and supporting assets</tspan><tspan x="110" dy="22">first.</tspan></text><rect x="110" y="485" width="180" height="46" rx="18" fill="url(#ga)"/><text x="200" y="514" class="chip" text-anchor="middle">Plan</text><rect x="445" y="230" width="310" height="345" rx="30" fill="#151b36" stroke="rgba(255,255,255,0.12)"/><rect x="445" y="230" width="310" height="8" rx="4" fill="url(#gb)"/><text class="label" x="475" y="296">Deploy assets</text><text class="copy" x="475" y="340"><tspan x="475" dy="0">Publish and connect the</tspan><tspan x="475" dy="22">stack with clear logic.</tspan></text><rect x="475" y="485" width="180" height="46" rx="18" fill="url(#gb)"/><text x="565" y="514" class="chip" text-anchor="middle">Deploy</text><rect x="810" y="230" width="310" height="345" rx="30" fill="#151b36" stroke="rgba(255,255,255,0.12)"/><rect x="810" y="230" width="310" height="8" rx="4" fill="url(#gc)"/><text class="label" x="840" y="296">Expand wisely</text><text class="copy" x="840" y="340"><tspan x="840" dy="0">Review what compounds</tspan><tspan x="840" dy="22">well before adding more.</tspan></text><rect x="840" y="485" width="180" height="46" rx="18" fill="url(#gc)"/><text x="930" y="514" class="chip" text-anchor="middle">Expand</text><path d="M390 402H445" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/><path d="M755 402H810" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/><rect x="150" y="640" width="900" height="58" rx="18" fill="#26305d" stroke="rgba(255,255,255,0.12)"/><text class="copy" x="600" y="677" text-anchor="middle">Roadmaps work best when they make the next review point visible instead of promising instant results from one isolated deliverable.</text></svg>
