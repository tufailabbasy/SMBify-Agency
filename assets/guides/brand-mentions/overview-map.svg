<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">How Brand Mentions Build Stronger Trust</title><desc id="desc">A stronger brand mentions works best when each layer reinforces the same buyer journey, page target, and trust story.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#180c14"/><stop offset="100%" stop-color="#341629"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb7185"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#2dd4bf"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#fb7185"/></linearGradient><style>.ey{font:700 18px Inter,Arial,sans-serif;letter-spacing:2.6px;text-transform:uppercase;fill:#f59e0b}.hd{font:700 48px Outfit,Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:500 20px Inter,Arial,sans-serif;fill:#dbe7f6}.label{font:700 24px Outfit,Inter,Arial,sans-serif;fill:#f8fafc}.copy{font:500 17px Inter,Arial,sans-serif;fill:#c9d7ea}.muted{font:600 15px Inter,Arial,sans-serif;fill:#a8bbd6}.chip{font:700 18px Inter,Arial,sans-serif;fill:#0b1220}</style></defs><rect width="1200" height="760" fill="url(#bg)"/><circle cx="1085" cy="104" r="145" fill="#fb7185" opacity="0.12"/><circle cx="155" cy="675" r="180" fill="#f59e0b" opacity="0.10"/><circle cx="920" cy="640" r="110" fill="#2dd4bf" opacity="0.09"/><path d="M110 650C250 600 310 520 430 470" stroke="#f59e0b" stroke-width="3" opacity="0.18" stroke-dasharray="10 12" fill="none"/><path d="M790 170C920 200 1010 265 1090 360" stroke="#fb7185" stroke-width="3" opacity="0.16" stroke-dasharray="10 12" fill="none"/><text class="ey" x="80" y="78">BRAND MENTIONS</text><text class="hd" x="80" y="138"><tspan x="80" dy="0">How Brand Mentions Build Stronger</tspan><tspan x="80" dy="22">Trust</tspan></text><text class="sub" x="80" y="196"><tspan x="80" dy="0">A stronger brand mentions works best when each layer reinforces the same buyer</tspan><tspan x="80" dy="22">journey, page target, and trust story.</tspan></text><rect x="430" y="280" width="340" height="200" rx="34" fill="#411f33" stroke="rgba(255,255,255,0.16)"/><rect x="430" y="280" width="340" height="10" rx="5" fill="url(#gb)"/><path d="M360 312L440 350" stroke="#fb7185" stroke-width="6" opacity="0.85" stroke-linecap="round"/><path d="M780 312L760 350" stroke="#f59e0b" stroke-width="6" opacity="0.85" stroke-linecap="round"/><path d="M360 570L440 440" stroke="#2dd4bf" stroke-width="6" opacity="0.85" stroke-linecap="round"/><path d="M780 570L760 440" stroke="#fb7185" stroke-width="6" opacity="0.85" stroke-linecap="round"/><rect x="110" y="235" width="310" height="150" rx="26" fill="#2a1422" stroke="rgba(255,255,255,0.12)"/><rect x="110" y="235" width="310" height="8" rx="4" fill="url(#ga)"/><text class="label" x="138" y="287">Context fit</text><text class="copy" x="138" y="323"><tspan x="138" dy="0">Mentions should appear near</tspan><tspan x="138" dy="22">the right topics and</tspan><tspan x="138" dy="22">entities.</tspan></text><rect x="780" y="235" width="310" height="150" rx="26" fill="#2a1422" stroke="rgba(255,255,255,0.12)"/><rect x="780" y="235" width="310" height="8" rx="4" fill="url(#gb)"/><text class="label" x="808" y="287">Recognition</text><text class="copy" x="808" y="323"><tspan x="808" dy="0">The brand should stay</tspan><tspan x="808" dy="22">identifiable across</tspan><tspan x="808" dy="22">placements.</tspan></text><rect x="110" y="510" width="310" height="150" rx="26" fill="#2a1422" stroke="rgba(255,255,255,0.12)"/><rect x="110" y="510" width="310" height="8" rx="4" fill="url(#gc)"/><text class="label" x="138" y="562">Coverage</text><text class="copy" x="138" y="598"><tspan x="138" dy="0">Trusted publications add</tspan><tspan x="138" dy="22">stronger perception lift.</tspan></text><rect x="780" y="510" width="310" height="150" rx="26" fill="#2a1422" stroke="rgba(255,255,255,0.12)"/><rect x="780" y="510" width="310" height="8" rx="4" fill="url(#ga)"/><text class="label" x="808" y="562">Recovery</text><text class="copy" x="808" y="598"><tspan x="808" dy="0">Unlinked mentions can become</tspan><tspan x="808" dy="22">future outreach wins.</tspan></text><text class="hd" x="600" y="365" text-anchor="middle"><tspan x="600" dy="0">Brand</tspan><tspan x="600" dy="48">Authority</tspan></text><text class="copy" x="600" y="428" text-anchor="middle"><tspan x="600" dy="0">Each piece should support the same offer,</tspan><tspan x="600" dy="22">page target, and buyer journey.</tspan></text></svg>
