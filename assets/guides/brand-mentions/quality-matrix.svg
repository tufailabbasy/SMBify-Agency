<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">The Checks That Protect Brand Mention Quality</title><desc id="desc">A better brand mentions setup is easier to trust when the team can explain the quality controls behind the output.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#180c14"/><stop offset="100%" stop-color="#341629"/></linearGradient><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb7185"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#2dd4bf"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#fb7185"/></linearGradient><style>.ey{font:700 18px Inter,Arial,sans-serif;letter-spacing:2.6px;text-transform:uppercase;fill:#f59e0b}.hd{font:700 48px Outfit,Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:500 20px Inter,Arial,sans-serif;fill:#dbe7f6}.label{font:700 24px Outfit,Inter,Arial,sans-serif;fill:#f8fafc}.copy{font:500 17px Inter,Arial,sans-serif;fill:#c9d7ea}.muted{font:600 15px Inter,Arial,sans-serif;fill:#a8bbd6}.chip{font:700 18px Inter,Arial,sans-serif;fill:#0b1220}</style></defs><rect width="1200" height="760" fill="url(#bg)"/><circle cx="1085" cy="104" r="145" fill="#fb7185" opacity="0.12"/><circle cx="155" cy="675" r="180" fill="#f59e0b" opacity="0.10"/><circle cx="920" cy="640" r="110" fill="#2dd4bf" opacity="0.09"/><path d="M110 650C250 600 310 520 430 470" stroke="#f59e0b" stroke-width="3" opacity="0.18" stroke-dasharray="10 12" fill="none"/><path d="M790 170C920 200 1010 265 1090 360" stroke="#fb7185" stroke-width="3" opacity="0.16" stroke-dasharray="10 12" fill="none"/><text class="ey" x="80" y="78">Quality Screen</text><text class="hd" x="80" y="138"><tspan x="80" dy="0">The Checks That Protect Brand</tspan><tspan x="80" dy="22">Mention Quality</tspan></text><rect x="90" y="250" width="490" height="155" rx="28" fill="#2a1422" stroke="rgba(255,255,255,0.12)"/><rect x="90" y="250" width="490" height="8" rx="4" fill="url(#ga)"/><text class="label" x="120" y="308">Relevance</text><text class="copy" x="120" y="348"><tspan x="120" dy="0">Mentions should sit in the right niche</tspan><tspan x="120" dy="22">context.</tspan></text><rect x="620" y="250" width="490" height="155" rx="28" fill="#2a1422" stroke="rgba(255,255,255,0.12)"/><rect x="620" y="250" width="490" height="8" rx="4" fill="url(#gb)"/><text class="label" x="650" y="308">Coverage</text><text class="copy" x="650" y="348"><tspan x="650" dy="0">The brand should appear across several</tspan><tspan x="650" dy="22">source types.</tspan></text><rect x="90" y="455" width="490" height="155" rx="28" fill="#2a1422" stroke="rgba(255,255,255,0.12)"/><rect x="90" y="455" width="490" height="8" rx="4" fill="url(#gc)"/><text class="label" x="120" y="513">Link mix</text><text class="copy" x="120" y="553"><tspan x="120" dy="0">A natural blend of linked and unlinked</tspan><tspan x="120" dy="22">mentions is healthier.</tspan></text><rect x="620" y="455" width="490" height="155" rx="28" fill="#2a1422" stroke="rgba(255,255,255,0.12)"/><rect x="620" y="455" width="490" height="8" rx="4" fill="url(#ga)"/><text class="label" x="650" y="513">Reuse</text><text class="copy" x="650" y="553"><tspan x="650" dy="0">The strongest placements should support</tspan><tspan x="650" dy="22">sales and content.</tspan></text><rect x="90" y="650" width="1020" height="62" rx="20" fill="#411f33" stroke="rgba(255,255,255,0.12)"/><text class="copy" x="600" y="689" text-anchor="middle"><tspan x="600" dy="0">A better brand mentions setup is easier to trust when the team can explain the quality</tspan><tspan x="600" dy="22">controls behind the output.</tspan></text></svg>
